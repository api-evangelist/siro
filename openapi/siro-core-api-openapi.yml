    post:
      summary: Get a signed URL for uploading a recording
      description: Generate signed upload and download URLs for an audio file. The upload URL can be used to upload the file directly to cloud storage.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fileType:
                  type: string
                  description: File type (limited to mp3, aac, wav)
                fileSize:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                  description: Size of the file in bytes
              required:
              - fileType
              - fileSize
              additionalProperties: false
      responses:
        '200':
          description: Get a signed URL for uploading a recording
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      uploadUrl:
                        type: string
                        description: Signed URL for uploading the file (PUT the body here).
                      uploadHeaders:
                        type: object
                        properties:
                          Content-Type:
                            type: string
                            description: MIME type for the file. Must be sent exactly when PUTting to `uploadUrl` (it is baked into the signature).
                          x-goog-content-length-range:
                            type: string
                            description: Allowed upload size range `0,<fileSize>`. Must be sent exactly when PUTting to `uploadUrl` (it is baked into the signature).
                        required:
                        - Content-Type
                        - x-goog-content-length-range
                        description: Headers that must be included exactly as given when PUTting the file to `uploadUrl`.
                      downloadUrl:
                        type: string
                        description: Pass this URL as `fileUrl` when creating the recording.
                      expiresAt:
                        type: string
                        description: When the signed URLs expire (ISO 8601 date-time).
                    required:
                    - uploadUrl
                    - uploadHeaders
                    - downloadUrl
                    - expiresAt
                  cursor:
                    anyOf:
                    - type: string
                    - type: number
                    - nullable: true
                  pageSize:
                    type: number
                  limit:
                    type: number
                  total:
                    type: number
                    nullable: true
                  hasNextPage:
                    type: boolean
                required:
                - data
