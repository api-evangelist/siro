      summary: List SiroNoticed results for the current user
      description: Returns the most recent SiroNoticed results generated for the calling user.
      parameters:
      - schema:
          type: string
        required: false
        name: organizationId
        in: query
      responses:
        '200':
          description: List SiroNoticed results for the current user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        userId:
                          type: string
                          description: Job owner
                        organizationId:
                          type: string
                          description: Organization of the job
                        result:
                          type: string
                          description: The result content
                      required:
                      - userId
                      - organizationId
                      - result
                  cursor:
                    anyOf:
                    - type: string
                    - type: number
                    - {}
                  pageSize:
                    type: number
                  limit:
                    type: number
                  total:
                    type:
                    - number
                    - 'null'
                  hasNextPage:
                    type: boolean
                required:
                - data
        '400':
          description: Bad Request - Invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                required:
