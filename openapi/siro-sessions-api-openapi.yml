openapi: 3.2.0
info:
  version: 1.0.0
  title: Swagger Sessions API
servers:
- url: https://api.siro.ai/
  description: Siro API Gateway
tags:
- name: Sessions
paths:
  /v1/sessions:
    get:
      summary: List past chat sessions for the authenticated user
      description: Returns session metadata (sessionId, title, createdAt, updatedAt, sourceSystem) ordered by most recent first. sourceSystem is AIF or AURORA -- Aurora conversations are read-only. Supports cursor-based pagination. Pass organizationId to scope results to a specific org (for org switchers).
      parameters:
      - schema:
          type: string
        required: false
        name: cursor
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        required: false
        name: limit
        in: query
      - schema:
          type: string
        required: false
        name: organizationId
        in: query
      responses:
        '200':
          description: List past chat sessions for the authenticated user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sessions:
                        type: array
                        items:
                          type: object
                          properties:
                            sessionId:
                              type: string
                            title:
                              type: string
                            createdAt:
                              type: string
                              format: date-time
                            updatedAt:
                              type: string
                              format: date-time
                            sourceSystem:
                              type: string
                              enum:
                              - AIF
                              - AURORA
                          required:
                          - sessionId
                          - title
                          - createdAt
                          - updatedAt
                          - sourceSystem
                      nextCursor:
                        type: string
                    required:
                    - sessions
                  cursor:
                    anyOf:
                    - type: string
                    - type: number
                    - {}
                  pageSize:
                    type: number
                  limit:
                    type: number
                  total:
                    type:
                    - number
                    - 'null'
                  hasNextPage:
                    type: boolean
                required:
                - data
        '400':
          description: Bad Request - Invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                required:
                - error
        '401':
          description: Unauthorized - User not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Authentication error message
                required:
                - error
        '403':
          description: Forbidden - User does not have access
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Authorization error message
                required:
                - error
        '404':
          description: Not Found - Resource not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Resource not found error message
                required:
                - error
        '422':
          description: Unprocessable Content - The request failed validation checks
          content:
            application/json:
              schema:
                type: object
                properties:
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        expected:
                          type: string
                        received:
                          type: string
                        path:
                          type: array
                          items:
                            anyOf:
                            - type: string
                            - type: number
                        message:
                          type: string
                      required:
                      - code
                      - path
                      - message
                  name:
                    type: string
                    enum:
                    - ZodError
                required:
                - issues
                - name
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Internal server error message
                required:
                - error
      security:
      - SiroAuthToken: []
      tags:
      - Sessions
      operationId: getV1Sessions
      x-operation-id-source: derived
  /v1/sessions/{sessionId}:
    get:
      summary: Get full message history for a chat session
      description: Validates ownership, then returns the full ChatMessage history for the session as Q&A message pairs. Each model row includes invocationId (feedback key) and persisted feedback when set. sourceSystem indicates AIF vs AURORA (Aurora conversations are read-only).
