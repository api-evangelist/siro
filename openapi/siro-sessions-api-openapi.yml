                                        minimum: 0
                                      segment:
                                        type: integer
                                        minimum: 0
                                    required:
                                    - kind
                                    - patches
                                    - seq
                                    - segment
                                  - type: object
                                    properties:
                                      kind:
                                        type: string
                                        enum:
                                        - markdown-tokens
                                      tokens:
                                        type: array
                                        items: {}
                                      segment:
                                        type: integer
                                        minimum: 0
                                      intermediate:
                                        type: boolean
                                    required:
                                    - kind
                                    - tokens
                                    - segment
                                  - type: object
                                    properties:
                                      kind:
                                        type: string
                                        enum:
                                        - segment-meta
                                      segment:
                                        type: integer
                                        minimum: 0
                                      intermediate:
                                        type: boolean
                                    required:
                                    - kind
                                    - segment
                                    - intermediate
                                  - type: object
                                    properties:
                                      kind:
                                        type: string
                                        enum:
                                        - halftime-report
                                      sections:
                                        type: array
                                        items:
                                          type: object
                                          properties:
                                            id:
                                              type: string
                                              description: ID of the Halftime report topic
                                            title:
                                              type: string
                                              description: Name of the Halftime report topic
                                            guidance:
                                              type: string
                                              description: Guidance generated for Halftime report topic
                                          required:
                                          - id
                                          - title
                                          - guidance
                                    required:
                                    - kind
                                    - sections
                              invocationId:
                                type: string
                              feedback:
                                type:
                                - string
                                - 'null'
                                enum:
                                - thumbs_up
                                - thumbs_down
                              feedbackText:
                                type: string
                                maxLength: 1000
                            required:
                            - role
                            - parts
                            - feedback
                      sourceSystem:
                        type: string
                        enum:
                        - AIF
                        - AURORA
                    required:
                    - sessionId
                    - title
                    - messages
                    - sourceSystem
                  cursor:
                    anyOf:
                    - type: string
                    - type: number
                    - {}
                  pageSize:
                    type: number
                  limit:
                    type: number
                  total:
                    type:
                    - number
                    - 'null'
                  hasNextPage:
                    type: boolean
                required:
