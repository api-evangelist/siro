                                      kind:
                                        type: string
                                        enum:
                                        - text
                                      text:
                                        type: string
                                    required:
                                    - kind
                                    - text
                                  - type: object
                                    properties:
                                      kind:
                                        type: string
                                        enum:
                                        - tool
                                      tool:
                                        type: string
                                        enum:
                                        - show_chart
                                      data: {}
                                    required:
                                    - kind
                                    - tool
                                  - type: object
                                    properties:
                                      kind:
                                        type: string
                                        enum:
                                        - markdown-patch
                                      patches:
                                        type: array
                                        items: {}
                                      seq:
                                        type: integer
                                        minimum: 0
                                      segment:
                                        type: integer
                                        minimum: 0
                                    required:
                                    - kind
                                    - patches
                                    - seq
                                    - segment
                                  - type: object
                                    properties:
                                      kind:
                                        type: string
                                        enum:
                                        - markdown-tokens
                                      tokens:
                                        type: array
                                        items: {}
                                      segment:
                                        type: integer
                                        minimum: 0
                                      intermediate:
                                        type: boolean
                                    required:
                                    - kind
                                    - tokens
                                    - segment
                                  - type: object
                                    properties:
                                      kind:
                                        type: string
                                        enum:
                                        - segment-meta
                                      segment:
                                        type: integer
                                        minimum: 0
                                      intermediate:
                                        type: boolean
                                    required:
                                    - kind
                                    - segment
                                    - intermediate
                                  - type: object
                                    properties:
                                      kind:
                                        type: string
                                        enum:
                                        - halftime-report
                                      sections:
                                        type: array
                                        items:
                                          type: object
                                          properties:
                                            id:
                                              type: string
                                              description: ID of the Halftime report topic
                                            title:
                                              type: string
                                              description: Name of the Halftime report topic
                                            guidance:
                                              type: string
                                              description: Guidance generated for Halftime report topic
                                          required:
                                          - id
                                          - title
                                          - guidance
                                    required:
                                    - kind
                                    - sections
                            required:
                            - role
                            - parts
                          - type: object
                            properties:
                              role:
                                type: string
                                enum:
                                - model
                              parts:
                                type: array
                                items:
                                  oneOf:
                                  - type: object
                                    properties:
                                      kind:
                                        type: string
                                        enum:
                                        - text
                                      text:
                                        type: string
                                    required:
                                    - kind
                                    - text
                                  - type: object
                                    properties:
                                      kind:
                                        type: string
                                        enum:
                                        - tool
                                      tool:
                                        type: string
