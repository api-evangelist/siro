openapi: 3.0.0
info:
  version: 1.0.0
  title: Swagger Audit Integrations API
servers:
- url: https://functions.siro.ai/api-externalApi
  description: Siro API external API endpoint
tags:
- name: Integrations
paths:
  /v1/integrations/accounts/{id}:
    get:
      summary: Get an account
      description: Get an account
      parameters:
      - schema:
          type: string
        required: true
        name: id
        in: path
      responses:
        '200':
          description: Get an account
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  externalId:
                    type: string
                    description: The ID of the account in the external system (e.g. Salesforce)
                  latitude:
                    type: number
                  longitude:
                    type: number
                  addresses:
                    type: array
                    items:
                      nullable: true
                  phoneNumbers:
                    type: array
                    items:
                      type: string
                  emailAddresses:
                    type: array
                    items:
                      type: string
                  name:
                    type: string
                  createdAt:
                    type: string
                    description: The date the account was created
                  updatedAt:
                    type: string
                    description: The date the account was last updated
                required:
                - id
                - externalId
                - addresses
                - createdAt
                - updatedAt
      security:
      - bearerAuth: []
      tags:
      - Integrations
    put:
      summary: Update an account
      description: Update an account
      parameters:
      - schema:
          type: string
        required: true
        name: id
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
                phoneNumbers:
                  type: array
                  items:
                    type: string
                emailAddresses:
                  type: array
                  items:
                    type: string
                addresses:
                  type: array
                  items:
                    type: object
                    properties:
                      country:
                        type: string
                      street:
                        type: string
                      city:
                        type: string
                      state:
                        type: string
                      zip:
                        type: string
                    required:
                    - country
                    - street
                    - city
                    - state
                    - zip
      responses:
        '200':
          description: Update an account
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  externalId:
                    type: string
                    description: The ID of the account in the external system (e.g. Salesforce)
                  latitude:
                    type: number
                  longitude:
                    type: number
                  addresses:
                    type: array
                    items:
                      nullable: true
                  phoneNumbers:
                    type: array
                    items:
                      type: string
                  emailAddresses:
                    type: array
                    items:
                      type: string
                  name:
                    type: string
                  createdAt:
                    type: string
                    description: The date the account was created
                  updatedAt:
                    type: string
                    description: The date the account was last updated
                required:
                - id
                - externalId
                - addresses
                - createdAt
                - updatedAt
      security:
      - bearerAuth: []
      tags:
      - Integrations
    delete:
      summary: Delete an account
      description: Delete an accounts
      parameters:
      - schema:
          type: string
        required: true
        name: id
        in: path
      responses:
        '200':
          description: Delete an account
          content:
            application/json:
              schema:
                type: boolean
      security:
      - bearerAuth: []
      tags:
      - Integrations
  /v1/integrations/accounts:
    get:
      summary: Get accounts
      description: Get accounts
      responses:
        '200':
          description: Get accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    externalId:
                      type: string
                      description: The ID of the account in the external system (e.g. Salesforce)
                    latitude:
                      type: number
                    longitude:
                      type: number
                    addresses:
                      type: array
                      items:
                        nullable: true
                    phoneNumbers:
                      type: array
                      items:
                        type: string
                    emailAddresses:
                      type: array
                      items:
                        type: string
                    name:
                      type: string
                    createdAt:
                      type: string
                      description: The date the account was created
                    updatedAt:
                      type: string
                      description: The date the account was last updated
                  required:
                  - id
                  - externalId
                  - addresses
                  - createdAt
                  - updatedAt
      security:
      - bearerAuth: []
      tags:
      - Integrations
    post:
      summary: Create an account
      description: Create an account
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - type: object
                properties:
                  externalId:
                    type: string
                    description: The ID of the account in the external system (e.g. Salesforce)
                  name:
                    type: string
                  latitude:
                    type: number
                  longitude:
                    type: number
                  phoneNumbers:
                    type: array
                    items:
                      type: string
                  emailAddresses:
                    type: array
                    items:
                      type: string
                  addresses:
                    type: array
                    items:
                      type: object
                      properties:
                        country:
                          type: string
                        street:
                          type: string
                        city:
                          type: string
                        state:
                          type: string
                        zip:
                          type: string
                      required:
                      - country
                      - street
                      - city
                      - state
                      - zip
                required:
                - externalId
                - latitude
                - longitude
              - type: object
                properties:
                  externalId:
                    type: string
                    description: The ID of the account in the external system (e.g. Salesforce)
                  name:
                    type: string
                  latitude:
                    type: number
                  longitude:
                    type: number
                  phoneNumbers:
                    type: array
                    items:
                      type: string
                  emailAddresses:
                    type: array
                    items:
                      type: string
                  addresses:
                    type: array
                    items:
                      type: object
                      properties:
                        country:
                          type: string
                        street:
                          type: string
                        city:
                          type: string
                        state:
                          type: string
                        zip:
                          type: string
                      required:
                      - country
                      - street
                      - city
                      - state
                      - zip
                required:
                - externalId
                - addresses
      responses:
        '200':
          description: Create an account
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  externalId:
                    type: string
                    description: The ID of the account in the external system (e.g. Salesforce)
                  latitude:
                    type: number
                  longitude:
                    type: number
                  addresses:
                    type: array
                    items:
                      nullable: true
                  phoneNumbers:
                    type: array
                    items:
                      type: string
                  emailAddresses:
                    type: array
                    items:
                      type: string
                  name:
                    type: string
                  createdAt:
                    type: string
                    description: The date the account was created
                  updatedAt:
                    type: string
                    description: The date the account was last updated
                required:
                - id
                - externalId
                - addresses
                - createdAt
                - updatedAt
      security:
      - bearerAuth: []
      tags:
      - Integrations
  /v1/integrations/opportunities/{id}:
    get:
      summary: Get an opportunity
      description: Get an opportunity
      parameters:
      - schema:
          type: string
        required: true
        name: id
        in: path
      responses:
        '200':
          description: Get an opportunity
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  externalId:
                    type: string
                    description: The ID of the opportunity in the external system (e.g. Salesforce)
                  name:
                    type: string
                    nullable: true
                    description: The name of the opportunity
                  amount:
                    type: number
                    description: The dollar amount of the opportunity
                  closedAt:
                    type: string
                    description: The closure date of the opportunity
                  disposition:
                    type: string
                    description: '"WON" | "LOST" | "OPEN"'
                  createdAt:
                    type: string
                    description: The date the opportunity was created
                  updatedAt:
                    type: string
                    description: The date the opportunity was last updated
                  recordingId:
                    type: string
                    description: The ID of the recording associated to the opportunity
                  accountId:
                    type: string
                  organizationId:
                    type: string
                  account:
                    nullable: true
                  opportunityUsers:
                    type: array
                    items:
                      nullable: true
                required:
                - id
                - externalId
                - createdAt
                - updatedAt
                - organizationId
      security:
      - bearerAuth: []
      tags:
      - Integrations
    delete:
      summary: Delete an opportunity
      description: Delete an opportunity
      parameters:
      - schema:
          type: string
        required: true
        name: id
        in: path
      responses:
        '200':
          description: Delete an opportunity
          content:
            application/json:
              schema:
                type: boolean
      security:
      - bearerAuth: []
      tags:
      - Integrations
  /v1/integrations/opportunities:
    get:
      summary: Get opportunities
      description: Get opportunities
      parameters:
      - schema:
          type: string
        required: false
        name: cursor
        in: query
      - schema:
          type: string
        required: false
        name: recordingId
        in: query
      - schema:
          type: string
        required: false
        name: externalId
        in: query
      responses:
        '200':
          description: Get opportunities
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        externalId:
                          type: string
                          description: The ID of the opportunity in the external system (e.g. Salesforce)
                        name:
                          type: string
                          nullable: true
                          description: The name of the opportunity
                        amount:
                          type: number
                          description: The dollar amount of the opportunity
                        closedAt:
                          type: string
                          description: The closure date of the opportunity
                        disposition:
                          type: string
                          description: '"WON" | "LOST" | "OPEN"'
                        createdAt:
                          type: string
                          description: The date the opportunity was created
                        updatedAt:
                          type: string
                          description: The date the opportunity was last updated
                        recordingId:
                          type: string
                          description: The ID of the recording associated to the opportunity
                        accountId:
                          type: string
                        organizationId:
                          type: string
                        account:
                          nullable: true
                        opportunityUsers:
                          type: array
                          items:
                            nullable: true
                      required:
                      - id
                      - externalId
                      - createdAt
                      - updatedAt
                      - organizationId
                  cursor:
                    anyOf:
                    - type: string
                    - type: number
                    - nullable: true
                  pageSize:
                    type: number
                  limit:
                    type: number
                  total:
                    type: number
                    nullable: true
                  hasNextPage:
                    type: boolean
                required:
                - data
      security:
      - bearerAuth: []
      tags:
      - Integrations
  /v1/integrations/opportunity-users/{id}:
