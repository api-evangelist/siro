name: Siro
description: >-
  Siro is an AI sales coaching platform for in-person and field sales teams.
  Reps record their live sales conversations from the Siro mobile app, and Siro
  transcribes each conversation, surfaces coaching insights, generates scorecards
  and summaries, and extracts structured fields (budget, objections, decision
  makers, timelines) that are pushed back into the team's CRM. Siro publishes a
  documented REST API and webhook surface that enables fully bidirectional,
  custom CRM integrations: syncing appointments/engagements, opportunities and
  accounts into Siro, matching recordings to CRM entities, and pulling recording
  details, summaries, entity extractions and coaching scorecards back out. The
  platform ships prebuilt integrations for Salesforce, HubSpot, Microsoft
  Dynamics, Pipedrive, Zoho, SalesRabbit, Leap SalesPro, Hatch, CompanyCam and a
  range of dealership DMS and home-services tools. Siro is backed by CRV and
  Index Ventures.
