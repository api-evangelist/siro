- aid: siro:siro-platform-api
  name: Siro Platform API
  description: >-
    The Siro Platform API served from the api.siro.ai gateway — 145 operations covering
    recordings and audio (list, detail, utterances, redacted-audio signed URLs, upload signed
    URLs, phone-call recording creation, CRM link create/replace/remove), conversation
    intelligence (summaries, entity extractions, followups, conversation configurations),
    coaching scorecards (available metrics, metric values, scorecard instances, evaluated
    instances), folders, org/team/user administration, in-product agents/sessions/jobs, and
    billing/licenses/invoices/subscription. This is the user-scoped surface Siro's own published
    Agent Skill documents as the second base URL alongside the External API; it authenticates
    with an OAuth access token in the x-siro-auth-token header.
