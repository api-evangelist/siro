  authorization-server metadata, no api-catalog, no ai-plugin.json, on any host. What it does
  serve, from the documentation host only, is the agent-discovery pair its docs platform emits:
  /.well-known/agent-card.json and /.well-known/agent-skills/siro/skill.md. Neither API host
  (functions.siro.ai, api.siro.ai) publishes anything at /.well-known/.
