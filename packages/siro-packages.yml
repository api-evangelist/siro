summary: >-
  Siro ships mobile capture SDKs, not server-side API clients. The recording surface — the part
  of Siro a partner embeds — is distributed as an iOS binary framework (Swift Package Manager +
  CocoaPods) and an Android AAR served from GitHub Packages. There is no first-party JavaScript,
  Python, Java, Go, Ruby, PHP or .NET client for the REST External API or the api.siro.ai gateway;
  the documented integration path for those is raw HTTP with a Bearer organization token.
currency_note: >-
  The iOS SDK is actively maintained on GitHub (2.6.3, 2026-06-15) but its CocoaPods trunk
  publication stopped at 1.3.16 on 2024-06-17, so a CocoaPods consumer is more than a major
  version behind the released framework. The React Native / Expo wrapper on npm last published
  0.7.7 on 2023-09-27 and its source repo is archived.
