summary: >-
  Siro has both a live remote MCP server and published OpenAPI, so this crosswalk is emitted —
  and it records a total divergence. Every one of the three MCP tools is a documentation tool
  (search the docs corpus, read a docs page, submit docs feedback) served by Siro's Mintlify docs
  deployment. None of them is backed by a Siro API operation, and none of the 214 published REST
  operations is reachable through MCP. Coverage is 0/214. An agent connected to
  https://docs.siro.ai/mcp can READ ABOUT the Siro API; it cannot CALL it.
